services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_log"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      AUDIT_LOG_DB_URL: "host=postgres port=5432 dbname=audit_log user=audit password=audit"
      AUDIT_LOG_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
